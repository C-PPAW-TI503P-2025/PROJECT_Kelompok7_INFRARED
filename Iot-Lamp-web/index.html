<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistem Monitoring IoT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="auth-section" class="container">
      <h2 id="auth-title">Login Admin</h2>
      <p id="auth-desc">Silakan masuk untuk memantau sistem.</p>

      <input
        type="email"
        id="email"
        placeholder="Email (Contoh: admin@gmail.com)"
        autocomplete="off"
      />
      <input type="password" id="password" placeholder="Password" />

      <button id="btn-submit" onclick="prosesAuth()">MASUK</button>

      <p id="error-msg" class="error-text"></p>
    </div>

    <div id="dashboard-section" class="container hidden">
      <div class="header">
        <h1>Kontrol Objek Virtual</h1>
        <button onclick="keluarAkun()" class="btn-logout">Logout</button>
      </div>

      <p>Status Sensor Obstacle:</p>
      <div id="visual-lampu" class="lampu mati"></div>
      <h2 id="status-teks">MENUNGGU DATA...</h2>

      <div class="footer">
        <p>Login sebagai: <span id="user-email">-</span></p>
        <p>Update: <span id="last-update">-</span></p>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
